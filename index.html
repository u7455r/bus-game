<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>কসবা বাস সিমুলেটর 3D - Kasba Upazila Highway Drive</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background: #87ceeb;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #game-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* মিটার ও লোকেশন ডিসপ্লে */
    #dashboard-ui {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 20;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .location-tag {
      font-size: 14px;
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .speedo {
      font-size: 26px;
      font-weight: 900;
      color: #ffcc00;
    }
    .passenger-count {
      font-size: 13px;
      color: #70e000;
      margin-top: 3px;
    }

    /* ক্যামেরা সুইচ বাটন */
    #camBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 25;
      background: rgba(0, 106, 78, 0.85);
      border: 1px solid #fff;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* মোবাইল কন্ট্রোল বাটন */
    .controls {
      position: absolute;
      bottom: 25px;
      z-index: 30;
      display: flex;
      gap: 15px;
    }
    .controls-left { left: 20px; }
    .controls-right { right: 20px; }
    .btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }
    .btn:active {
      background: rgba(0, 255, 204, 0.5);
      transform: scale(0.92);
    }
    @media (min-width: 800px) {
      .controls { display: none; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="dashboard-ui">
    <div class="location-tag">📍 কসবা উপজেলা, ব্রাহ্মণবাড়িয়া</div>
    <div>গতি: <span class="speedo" id="speedText">0</span> কিমি/ঘণ্টা</div>
    <div class="passenger-count">👥 বাসে যাত্রী: ১৬ জন</div>
  </div>

  <button id="camBtn">ক্যামেরা ভিউ পরিবর্তন 🎥</button>

  <div class="controls controls-left">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div class="controls controls-right">
    <div class="btn" id="btnBrake" style="background: rgba(235, 77, 75, 0.4);">ব্রেক</div>
    <div class="btn" id="btnGas" style="background: rgba(46, 204, 113, 0.4);">গ্যাস</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script>
    // ১. সিন, আলো ও ক্যামেরা
    const canvas = document.getElementById('game-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.007);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.3);
    sunLight.position.set(40, 80, 40);
    sunLight.castShadow = true;
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));

    // ২. সম্পূর্ণ ৩ডি বাস তৈরি (Full Bus Body + Glass + Passengers)
    const busGroup = new THREE.Group();
    scene.add(busGroup);

    // বাসের মূল বডি (লাল-সবুজ দেশীয় সুপারক্লাস এক্সপ্রেস বাস)
    const busBodyMat = new THREE.MeshStandardMaterial({ color: 0x006a4e, roughness: 0.4 }); // গাঢ় সবুজ
    const stripeMat = new THREE.MeshStandardMaterial({ color: 0xd90429, roughness: 0.4 });  // লাল স্ট্রাইপ
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.45, roughness: 0.1 });

    const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.2, 8.5), busBodyMat);
    lowerBody.position.y = 0.9;
    busGroup.add(lowerBody);

    const redStripe = new THREE.Mesh(new THREE.BoxGeometry(2.82, 0.35, 8.52), stripeMat);
    redStripe.position.y = 1.1;
    busGroup.add(redStripe);

    const roof = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.35, 8.5), busBodyMat);
    roof.position.y = 2.75;
    busGroup.add(roof);

    // বাসের বড় গ্লাস/উইন্ডোজ
    const sideGlassL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 7.5), glassMat);
    sideGlassL.position.set(-1.36, 2.0, 0.2);
    const sideGlassR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 7.5), glassMat);
    sideGlassR.position.set(1.36, 2.0, 0.2);
    const frontWindshield = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.4, 0.1), glassMat);
    frontWindshield.position.set(0, 2.0, -4.2);
    frontWindshield.rotation.x = -0.15;
    const backGlass = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.2, 0.1), glassMat);
    backGlass.position.set(0, 2.0, 4.22);
    busGroup.add(sideGlassL, sideGlassR, frontWindshield, backGlass);

    // বাসের চাকা
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
    const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.35, 20);
    const wheelPositions = [
      [-1.4, 0.5, -2.6], [1.4, 0.5, -2.6],
      [-1.4, 0.5, 2.4], [1.4, 0.5, 2.4]
    ];
    wheelPositions.forEach(pos => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(...pos);
      busGroup.add(w);
    });

    // ড্যাশবোর্ড ও স্টিয়ারিং (কেবিনের ভেতরে)
    const dash = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.6, 0.8), new THREE.MeshStandardMaterial({ color: 0x222 }));
    dash.position.set(0, 1.5, -3.7);
    busGroup.add(dash);

    const steerRing = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.03, 16, 30), new THREE.MeshStandardMaterial({ color: 0x050505 }));
    steerRing.position.set(-0.65, 1.65, -3.4);
    steerRing.rotation.x = 0.5;
    busGroup.add(steerRing);

    // বাসের ভেতরের বসা যাত্রী তৈরি (Passengers seated inside)
    function createPassengers() {
      const shirtColors = [0x3a86ff, 0xff006e, 0xfb5607, 0xffbe0b, 0x8338ec, 0x2ec4b6, 0xffffff];
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a373 });

      // বাসের দুই পাশে ৪ সারি করে সিট ও যাত্রী
      for (let z = -2.2; z <= 3.2; z += 1.4) {
        [-0.75, 0.75].forEach(x => {
          // সিট
          const seat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.5), new THREE.MeshStandardMaterial({ color: 0x1d3557 }));
          seat.position.set(x, 1.4, z);
          busGroup.add(seat);

          // যাত্রী শরীর
          const randomColor = shirtColors[Math.floor(Math.random() * shirtColors.length)];
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.3), new THREE.MeshStandardMaterial({ color: randomColor }));
          body.position.set(x, 1.8, z);

          // যাত্রী মাথা
          const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), skinMat);
          head.position.set(x, 2.15, z);

          busGroup.add(body, head);
        });
      }
    }
    createPassengers();

    // ৩. ক্যামেরা ভিউ সিস্টেম (First-Person vs Third-Person)
    let isThirdPerson = true; // ডিফল্টভাবে পুরো বাস দেখা যাবে
    function updateCameraView() {
      if (isThirdPerson) {
        camera.position.set(0, 4.5, 9.5); // বাসের ঠিক পেছনে ও ওপরে (পুরো বাস দেখা যাবে)
        camera.lookAt(busGroup.position.x, busGroup.position.y + 1.8, busGroup.position.z - 15);
      } else {
        camera.position.set(-0.65, 1.9, -3.0); // কেবিনের ভেতরে চালকের চোখে
        camera.lookAt(busGroup.position.x - 0.65, busGroup.position.y + 1.9, busGroup.position.z - 20);
      }
    }
    document.getElementById('camBtn').addEventListener('click', () => {
      isThirdPerson = !isThirdPerson;
    });

    // ৪. রাস্তা ও হাইওয়ে
    const ROAD_LEN = 1400;
    const roadWidth = 16;

    const roadMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(roadWidth, ROAD_LEN),
      new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.9 })
    );
    roadMesh.rotation.x = -Math.PI / 2;
    roadMesh.position.z = -ROAD_LEN / 2 + 50;
    scene.add(roadMesh);

    // লেন ডিভাইডার দাগ
    for (let z = 20; z > -ROAD_LEN; z -= 14) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.02, z);
      scene.add(line);
    }

    // মাটি/সবুজ মাঠ
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(700, ROAD_LEN),
      new THREE.MeshStandardMaterial({ color: 0x386641, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, -0.05, -ROAD_LEN / 2 + 50);
    scene.add(ground);

    // ৫. কসবা উপজেলা ওয়েলকাম গেট এবং তোরণ
    function createKasbaWelcomeGate(z) {
      const gate = new THREE.Group();
      const pMat = new THREE.MeshStandardMaterial({ color: 0x4a5568 });
      const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 0.8), pMat);
      pillarL.position.set(-7.5, 4, 0);
      const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 0.8), pMat);
      pillarR.position.set(7.5, 4, 0);
      gate.add(pillarL, pillarR);

      // ব্যানার
      const canvasBoard = document.createElement('canvas');
      canvasBoard.width = 1024;
      canvasBoard.height = 256;
      const ctx = canvasBoard.getContext('2d');
      ctx.fillStyle = '#006a4e';
      ctx.fillRect(0, 0, 1024, 256);
      ctx.fillStyle = '#d90429';
      ctx.lineWidth = 14;
      ctx.strokeRect(8, 8, 1008, 240);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 54px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('স্বাগতম কসবা উপজেলা', 512, 105);
      ctx.font = '36px Arial';
      ctx.fillStyle = '#ffbe0b';
      ctx.fillText('ঐতিহাসিক কসবা সীমান্ত ও ব্রাহ্মণবাড়িয়া', 512, 185);

      const tex = new THREE.CanvasTexture(canvasBoard);
      const signBoard = new THREE.Mesh(new THREE.PlaneGeometry(15, 3.8), new THREE.MeshBasicMaterial({ map: tex }));
      signBoard.position.set(0, 6.5, 0);
      gate.add(signBoard);

      gate.position.z = z;
      scene.add(gate);
    }
    createKasbaWelcomeGate(-60);
    createKasbaWelcomeGate(-700);

    // ৬. পাশের চলমান গাড়ি (Traffic Vehicles)
    const trafficCars = [];
    function createTrafficCar(x, z, speed, color) {
      const car = new THREE.Group();
      const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.2, 4.2), new THREE.MeshStandardMaterial({ color: color }));
      carBody.position.y = 0.7;
      const carTop = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 2.2), new THREE.MeshStandardMaterial({ color: 0x333333 }));
      carTop.position.set(0, 1.5, -0.2);
      car.add(carBody, carTop);

      car.position.set(x, 0, z);
      scene.add(car);
      trafficCars.push({ mesh: car, speed: speed, initX: x });
    }

    createTrafficCar(4.5, -120, 0.45, 0xe63946);
    createTrafficCar(4.8, -300, 0.55, 0xffb703);
    createTrafficCar(-4.5, -200, 0.35, 0x2a9d8f);
    createTrafficCar(-4.8, -480, 0.40, 0x457b9d);

    // ৭. ড্রাইভিং কন্ট্রোল ও ফিজিক্স
    const keys = { w: false, s: false, a: false, d: false };
    let speed = 0;
    let steerAngle = 0;
    const maxSpeed = 1.35;
    const accel = 0.012;
    const friction = 0.985;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.d = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.d = false;
    });

    function bindBtn(id, prop) {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[prop] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[prop] = false; });
      btn.addEventListener('mousedown', () => keys[prop] = true);
      btn.addEventListener('mouseup', () => keys[prop] = false);
    }
    bindBtn('btnGas', 'w');
    bindBtn('btnBrake', 's');
    bindBtn('btnLeft', 'a');
    bindBtn('btnRight', 'd');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const speedUI = document.getElementById('speedText');

    // ৮. অ্যানিমেশন ও রেন্ডার লুপ
    function animate() {
      requestAnimationFrame(animate);

      // স্পিড ক্যালকুলেশন
      if (keys.w) speed = Math.min(speed + accel, maxSpeed);
      else if (keys.s) speed = Math.max(speed - accel * 1.5, -0.3);
      else speed *= friction;

      // স্টিয়ারিং কন্ট্রোল
      if (keys.a) steerAngle = Math.max(steerAngle - 0.04, -0.75);
      else if (keys.d) steerAngle = Math.min(steerAngle + 0.04, 0.75);
      else steerAngle *= 0.85;

      // বাসের চলাচল
      if (Math.abs(speed) > 0.005) {
        busGroup.rotation.y -= steerAngle * 0.02 * (speed / maxSpeed);
      }
      busGroup.translateZ(-speed);

      // স্টিয়ারিং ঘোরানো
      steerRing.rotation.z = -steerAngle * 2.8;

      // ট্রাফিক গাড়ি চলাচল
      trafficCars.forEach(car => {
        car.mesh.position.z -= car.speed;
        if (car.mesh.position.z < busGroup.position.z - 300) {
          car.mesh.position.z = busGroup.position.z + 100;
        }
      });

      // ক্যামেরা বাসের অবস্থান ফলো করা
      if (isThirdPerson) {
        const offset = new THREE.Vector3(0, 4.2, 10).applyMatrix4(busGroup.matrixWorld);
        camera.position.lerp(offset, 0.15);
        camera.lookAt(busGroup.position.x, busGroup.position.y + 1.5, busGroup.position.z - 8);
      } else {
        const cabinOffset = new THREE.Vector3(-0.65, 1.9, -3.0).applyMatrix4(busGroup.matrixWorld);
        camera.position.copy(cabinOffset);
        const lookTarget = new THREE.Vector3(-0.65, 1.9, -15).applyMatrix4(busGroup.matrixWorld);
        camera.lookAt(lookTarget);
      }

      // রাস্তা অনন্ত করা
      if (busGroup.position.z < -ROAD_LEN + 200) {
        busGroup.position.z = 0;
      }

      speedUI.innerText = Math.abs(Math.round(speed * 85));
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
